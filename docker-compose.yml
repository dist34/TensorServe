services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tensorserve-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
            # specific to my nvidia gpu (0) which is 1650 change this according to ur preference
              device_ids: ["0"]
              capabilities: [gpu]
    volumes:
      # Live-reload backend code changes without rebuilding the image
      - ./Backend:/app
      # Keep the container's own venv/deps separate from the host mount
      - backend_venv:/app/.venv
    restart: unless-stopped
    networks:
      - tensorserve-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tensorserve-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./Frontend/.env
    environment:
      # The browser (not the container) calls the API, so this must be
      # a host-reachable address, not the Docker service name.
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - tensorserve-net

networks:
  tensorserve-net:
    driver: bridge

volumes:
  backend_venv:
  frontend_node_modules: